[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scmaf"
version = "0.1.0"
description = "Multi-modal attention fusion for multi-omics and multi-view clustering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.9",
  "matplotlib>=3.7",
  "numpy>=1.24,<2.1",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
scmaf-train = "scmaf.cli:main"

[tool.setuptools.packages.find]
include = ["scmaf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

